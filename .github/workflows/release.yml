name: Release macOS DMG

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  # Release jobs share one moving RC appcast, so they must publish serially.
  group: quill-release-publisher
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, notarize, and upload
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          ./scripts/test-release-metadata.sh
          ./scripts/release-metadata.sh "$RELEASE_TAG" "$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Validate release secrets
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          : "${CERTIFICATE:?Missing DEVELOPER_ID_CERTIFICATE_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Missing DEVELOPER_ID_CERTIFICATE_PASSWORD}"
          : "${APPLE_ID:?Missing APPLE_ID}"
          : "${APPLE_APP_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          : "${SPARKLE_ED_PRIVATE_KEY:?Missing SPARKLE_ED_PRIVATE_KEY}"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/quill-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$CERTIFICATE" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
            | head -n 1)
          test -n "$SIGNING_IDENTITY"

          echo "QUILL_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          xcodegen generate
          xcodebuild \
            -project Quill.xcodeproj \
            -scheme Quill \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build signed universal app
        env:
          MARKETING_VERSION: ${{ steps.release.outputs.marketing_version }}
          RELEASE_LABEL: ${{ steps.release.outputs.release_label }}
        run: |
          QUILL_MARKETING_VERSION="$MARKETING_VERSION" \
          QUILL_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
          QUILL_RELEASE_LABEL="$RELEASE_LABEL" \
          ./scripts/build.sh

      - name: Create and sign DMG
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          SAFE_TAG=$(printf '%s' "$RELEASE_TAG" | tr -c 'A-Za-z0-9._-' '-')
          DMG_PATH="$GITHUB_WORKSPACE/dist/Quill-${SAFE_TAG}-macOS.dmg"

          ./scripts/create-dmg.sh "$GITHUB_WORKSPACE/dist/Quill.app" "$DMG_PATH"
          codesign \
            --force \
            --timestamp \
            --sign "$QUILL_SIGNING_IDENTITY" \
            "$DMG_PATH"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

      - name: Generate signed Sparkle appcast
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.release_channel }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SPARKLE_VERSION=2.9.6
          SPARKLE_ARCHIVE="$RUNNER_TEMP/Sparkle-$SPARKLE_VERSION.tar.xz"
          SPARKLE_TOOLS="$RUNNER_TEMP/sparkle-tools"
          APPCAST_DIR="$RUNNER_TEMP/quill-appcast"
          KEY_FILE="$RUNNER_TEMP/quill-sparkle-ed-key"
          RC_CHANNEL_TAG=quill-rc-channel

          curl --fail --location --silent --show-error \
            --output "$SPARKLE_ARCHIVE" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p "$SPARKLE_TOOLS" "$APPCAST_DIR"
          tar -xJf "$SPARKLE_ARCHIVE" -C "$SPARKLE_TOOLS"

          # Seed generation with the moving channel feed so RC testers see the
          # full path from stable -> RC -> final, while stable clients filter
          # out entries marked with the rc Sparkle channel.
          if gh release view "$RC_CHANNEL_TAG" >/dev/null 2>&1; then
            gh release download "$RC_CHANNEL_TAG" \
              --pattern appcast.xml \
              --dir "$APPCAST_DIR" \
              --clobber
          fi

          DMG_NAME=$(basename "$DMG_PATH")
          cp "$DMG_PATH" "$APPCAST_DIR/$DMG_NAME"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          trap 'rm -P "$KEY_FILE" 2>/dev/null || true' EXIT

          if [ "$RELEASE_CHANNEL" = rc ]; then
            "$SPARKLE_TOOLS/bin/generate_appcast" \
              --ed-key-file "$KEY_FILE" \
              --channel rc \
              --maximum-versions 5 \
              --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/" \
              --link "https://github.com/${{ github.repository }}/releases" \
              "$APPCAST_DIR"
          else
            "$SPARKLE_TOOLS/bin/generate_appcast" \
              --ed-key-file "$KEY_FILE" \
              --maximum-versions 5 \
              --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/" \
              --link "https://github.com/${{ github.repository }}/releases" \
              "$APPCAST_DIR"
          fi

          rm -P "$KEY_FILE"
          trap - EXIT
          test -f "$APPCAST_DIR/appcast.xml"
          echo "APPCAST_PATH=$APPCAST_DIR/appcast.xml" >> "$GITHUB_ENV"

      - name: Attach DMG and appcast to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          LATEST_DMG_PATH="$GITHUB_WORKSPACE/dist/Quill-macOS.dmg"
          cp "$DMG_PATH" "$LATEST_DMG_PATH"
          gh release upload "$RELEASE_TAG" "$DMG_PATH" "$LATEST_DMG_PATH" "$APPCAST_PATH" --clobber

      - name: Publish moving RC channel appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RC_CHANNEL_TAG=quill-rc-channel
          if ! gh release view "$RC_CHANNEL_TAG" >/dev/null 2>&1; then
            gh release create "$RC_CHANNEL_TAG" \
              --target "$GITHUB_SHA" \
              --title "Quill release-candidate update channel" \
              --notes "Machine-managed Sparkle feed for opted-in release-candidate testers." \
              --prerelease
          fi

          gh release upload "$RC_CHANNEL_TAG" "$APPCAST_PATH" --clobber

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN_PATH:-}" ] && [ -f "$SIGNING_KEYCHAIN_PATH" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH"
          fi
